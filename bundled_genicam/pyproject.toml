[dependency-groups]
dev = [
  "genicam>=1.6.0",
  "nanobind>=3.0.1",
  "pytest>=9.1.1",
  "pytest-forked>=1.7.5",
  "pytest-timeout>=2.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "tests15"]
# Every test runs in its own forked subprocess: a real GenTL Producer keeps
# process-global state (see tests/conftest.py's module docstring), and a
# native crash anywhere in the wrapper must not take down the whole test
# session. `--timeout` guards against a test hanging forever on a stuck
# EventGetData()/DSStartAcquisition() call.
addopts = "--forked --timeout=90"

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=3.0.1"]
build-backend = "scikit_build_core.build"

[project]
name = "gentl"
version = "0.1.0"
description = "Python bindings for the GenICam GenTL 1.5 (v3.0.2) and 1.6 APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = []

[tool.scikit-build.cmake]
version = ">=3.15"
build-type = "Release"

[tool.scikit-build.sdist]
include = ["CMakeLists.txt", "src/**", "README.md"]
